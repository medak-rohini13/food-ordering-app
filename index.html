<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie Order System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: white;
        }

        .card {
            background: #1e293b;
            color: white;
            border: none;
        }

        .price {
            color: #38bdf8;
            font-weight: bold;
        }

        .cart-box {
            background: #111827;
            padding: 15px;
            border-radius: 10px;
            position: sticky;
            top: 20px;
        }

        .btn-custom {
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold">🍔 Foodie Express</a>
        </div>
    </nav>

    <!-- HERO -->
    <div class="text-center py-4">
        <h1>Order Your Favourite Food 🍕</h1>
        <p>Fast delivery • Hot & Fresh</p>
    </div>

    <div class="container">
        <div class="row">

            <!-- MENU -->
            <div class="col-md-8">
                <div class="row g-3">

                    <div class="col-md-6">
                        <div class="card p-3">
                            <h5>Veg Burger</h5>
                            <p class="price">₹120</p>
                            <button class="btn btn-success btn-custom" onclick="addToCart('Veg Burger',120)">
                                Add to Cart
                            </button>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card p-3">
                            <h5>Chicken Pizza</h5>
                            <p class="price">₹250</p>
                            <button class="btn btn-success btn-custom" onclick="addToCart('Chicken Pizza',250)">
                                Add to Cart
                            </button>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card p-3">
                            <h5>Cold Coffee</h5>
                            <p class="price">₹90</p>
                            <button class="btn btn-success btn-custom" onclick="addToCart('Cold Coffee',90)">
                                Add to Cart
                            </button>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="card p-3">
                            <h5>Paneer Wrap</h5>
                            <p class="price">₹150</p>
                            <button class="btn btn-success btn-custom" onclick="addToCart('Paneer Wrap',150)">
                                Add to Cart
                            </button>
                        </div>
                    </div>

                </div>
            </div>

            <!-- CART -->
            <div class="col-md-4">
                <div class="cart-box">
                    <h4>🛒 Cart</h4>
                    <ul id="cartList" class="list-unstyled"></ul>
                    <hr>
                    <h5>Total: ₹<span id="total">0</span></h5>
                    <button class="btn btn-warning w-100 mt-2">Checkout</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let total = 0;

        function addToCart(item, price) {
            const list = document.getElementById("cartList");

            const li = document.createElement("li");
            li.textContent = `${item} - ₹${price}`;
            list.appendChild(li);

            total += price;
            document.getElementById("total").innerText = total;
        }
    </script>

</body>

</html>
